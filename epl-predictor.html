<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Redfooty EPL Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="icon" href="/favicon.png"/>
<style>
:root{
  --maroon:#7C1632;
  --maroon-deep:#54101F;
  --crimson:#C41E3A;
  --teal:#12A594;
  --ink:#0E0F12;
  --panel:#15171B;
  --panel-2:#1C1F24;
  --line:rgba(255,255,255,.10);
  --muted:#9AA0A6;
  --gold:#D8A93C;
  --silver:#B9C0C6;
  --bronze:#C17A4E;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--ink);color:#f1f5f9;font-family:'Inter',system-ui,sans-serif;min-height:100vh;padding-bottom:40px;font-size:15px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.spin{animation:spin .7s linear infinite;display:inline-block}
#app{max-width:480px;margin:0 auto}

.header{
  background:
    radial-gradient(circle at 85% 0%, rgba(124,22,50,.55), transparent 45%),
    radial-gradient(circle at 5% 100%, rgba(18,165,148,.18), transparent 45%),
    var(--ink);
  border-bottom:1px solid var(--line);padding:14px 16px 10px;position:sticky;top:0;z-index:50
}
.header-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand-row{display:flex;align-items:center;gap:9px}
.brand-mark{width:34px;height:34px;border-radius:50%;object-fit:cover;flex-shrink:0;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.logo{font-family:'Anton',sans-serif;font-size:16px;font-weight:400;letter-spacing:.3px;line-height:1.15;text-transform:uppercase}
.logo em{color:var(--crimson);font-style:normal}
.logo-sub{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.user-pill{font-size:12px;color:var(--muted);margin-top:3px}
.nav{display:flex;gap:4px;background:var(--panel);border-radius:12px;padding:4px;margin-top:12px}
.nav-btn{flex:1;padding:8px 0;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:var(--muted);font-family:inherit;transition:all .18s}
.nav-btn.active{background:var(--crimson);color:#fff}

.section{padding:14px 14px 0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:11px;animation:fadein .2s ease}
.card-live{background:#1a0d10;border:1px solid rgba(196,30,58,.4);border-radius:16px;padding:16px;margin-bottom:11px;animation:fadein .2s ease}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.b-live{background:rgba(196,30,58,.18);color:#ef4a63}
.b-done{background:rgba(18,165,148,.18);color:#2dd4bf}
.b-soon{background:rgba(216,169,60,.18);color:var(--gold)}
.b-off{background:rgba(154,160,166,.15);color:var(--muted)}
.b-p10{background:rgba(18,165,148,.2);color:#2dd4bf}
.b-p5{background:rgba(18,165,148,.15);color:#5eead4}
.b-p2{background:rgba(216,169,60,.18);color:var(--gold)}
.b-p0{background:rgba(154,160,166,.15);color:var(--muted)}
.b-elig{background:rgba(18,165,148,.18);color:#2dd4bf}
.b-inelig{background:rgba(196,30,58,.18);color:#ef4a63}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--crimson);display:inline-block;animation:pulse 1s infinite;flex-shrink:0}

.match-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px}
.match-time{font-size:12px;color:var(--muted)}
.teams-row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.team{display:flex;flex-direction:column;align-items:center;gap:6px;width:38%}
.team img{width:30px;height:30px;object-fit:contain}
.team-name{font-size:13px;font-weight:600;text-align:center;line-height:1.25}
.vs{font-size:12px;color:#5b5f66;font-weight:600}
.score{font-family:'Anton',sans-serif;font-size:26px;font-weight:400;letter-spacing:0}

.pred-row{display:flex;align-items:center;gap:8px;margin-top:14px}
.pick-btn{flex:1;background:transparent;border:1.5px solid var(--line);border-radius:10px;padding:9px 4px;cursor:pointer;font-family:inherit;color:var(--muted);text-align:center;transition:all .15s}
.pick-btn:disabled{opacity:.5;cursor:default}
.pick-label{font-size:12px;font-weight:700;line-height:1.25}
.pick-pts{color:var(--gold);font-weight:800}
.pick-pts-preview{color:var(--muted);font-weight:700;font-style:italic}
.pick-active-blue{border-color:var(--teal);color:#2dd4bf;background:rgba(18,165,148,.1)}
.pick-active-amber{border-color:var(--gold);color:var(--gold);background:rgba(216,169,60,.1)}
.pred-row input{width:100%;background:var(--ink);border:1px solid var(--line);color:#f1f5f9;border-radius:10px;padding:10px;font-size:17px;font-weight:700;text-align:center;font-family:inherit}
.pred-row input:focus{outline:none;border-color:var(--crimson)}
.dash{color:#5b5f66;font-weight:700}
.btn{background:var(--crimson);color:#fff;border:none;border-radius:10px;padding:11px 14px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;width:100%;margin-top:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn-ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn-danger{background:transparent;border:1px solid rgba(196,30,58,.4);color:#ef4a63}
.btn-inline{width:auto;padding:8px 14px;margin:0}

.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.field input{width:100%;background:var(--ink);border:1px solid var(--line);color:#f1f5f9;border-radius:10px;padding:12px;font-size:15px;font-family:inherit}
.field input:focus{outline:none;border-color:var(--crimson)}
.hint{font-size:11px;color:var(--muted);margin-top:5px}

.auth-wrap{padding:40px 16px 16px}
.auth-title{font-family:'Anton',sans-serif;font-size:28px;font-weight:400;letter-spacing:.2px;margin-bottom:6px;text-transform:uppercase}
.auth-sub{font-size:13px;color:var(--muted);margin-bottom:22px;line-height:1.5}
.auth-alt{text-align:center;font-size:13px;color:var(--muted);margin-top:16px}
.link{color:#2dd4bf;background:none;border:none;font:inherit;cursor:pointer;text-decoration:underline;padding:0}

.pill-brand{display:inline-block;background:var(--crimson);color:#fff;padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.2px;text-decoration:none}
.pill-brand:hover{background:#a8172f;color:#fff}
.pill-support{display:inline-block;background:rgba(18,165,148,.14);color:var(--teal);padding:8px 16px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.2px;text-decoration:none;border:1px solid rgba(18,165,148,.35)}
.pill-support:hover{background:rgba(18,165,148,.24);color:var(--teal)}

.otp-input{letter-spacing:.5em;text-align:center;font-size:24px!important;font-weight:800}

.banner{border-radius:12px;padding:11px 13px;font-size:12px;line-height:1.5;margin-bottom:11px}
.banner-warn{background:rgba(216,169,60,.1);border:1px solid rgba(216,169,60,.3);color:var(--gold)}
.banner-err{background:rgba(196,30,58,.1);border:1px solid rgba(196,30,58,.3);color:#ef4a63}
.banner-info{background:rgba(18,165,148,.08);border:1px solid rgba(18,165,148,.25);color:#5eead4}

.sel{width:100%;background:var(--panel);border:1px solid var(--line);color:#f1f5f9;border-radius:10px;padding:11px;font-size:14px;font-weight:600;font-family:inherit;margin-bottom:12px}
.sel:focus{outline:none;border-color:var(--crimson)}

.eyebrow{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal);margin:6px 0 10px}
.empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:13px;line-height:1.6}

.lb-row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:8px}
.lb-row.me{border-color:var(--crimson);background:rgba(196,30,58,.08)}
.lb-rank{font-family:'Anton',sans-serif;font-size:16px;font-weight:400;color:var(--muted);width:26px;flex-shrink:0}
.lb-row.me .lb-rank{color:var(--crimson)}
.lb-name{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-sub{font-size:11px;color:var(--muted);font-weight:400;margin-top:2px;white-space:normal;line-height:1.4}
.lb-pts{font-family:'Anton',sans-serif;font-size:19px;font-weight:400;letter-spacing:0}

.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv:last-child{border-bottom:none}
.kv span:first-child{color:var(--muted)}
.kv span:last-child{font-weight:600;text-align:right;word-break:break-word}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:420px}
.toast{background:var(--panel-2);border:1px solid var(--line);color:#f1f5f9;border-radius:12px;padding:11px 15px;font-size:13px;font-weight:600;animation:fadein .18s ease;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.err{background:#2a1013;border-color:rgba(196,30,58,.5);color:#fca5a5}
.toast.ok{background:#0d2624;border-color:rgba(18,165,148,.5);color:#5eead4}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="rules-data.js"></script>
<script>
/* ============================================================
   CONFIG — paste your two Supabase values here.
   Both are safe in client code by design.
   The football-data.org token is NOT here; it lives in the
   Edge Function. See brief §4.4.
   ============================================================ */
const LOGO_URL = "/logo-96.png";
const SUPABASE_URL      = "https://snxrkdsrzzamoowijwcj.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_2kSeLlLmNsFsFn-jcZe7Tw_aOdtUAEl";

/* ============================================================ */

const sb  = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const app = document.getElementById("app");

const OPEN_STATUS = ["SCHEDULED", "TIMED"];
const LIVE_STATUS = ["IN_PLAY", "PAUSED", "LIVE"];
// Must match the interval in fixture_is_open() in schema.sql - not
// read from a shared source, so keep both in sync by hand if this
// ever changes. Deliberately NOT tied to odds anymore (revised 06 Aug
// 2026) - odds freeze separately, 24h out, see previewPointsForPick().
const PREDICTION_LOCK_HOURS = 2;

const S = {
  ready: false, session: null, profile: null,
  view: new URLSearchParams(location.search).get("view") === "signup" ? "signup" : "login",
                               // login | signup | otp | reset
  otpEmail: null, otpFlow: null,
  tab: "predict",             // predict | results | table | settings
  fixtures: [], preds: {}, board: [], syncAge: null,
  md: null, rmd: null,
  loadErr: null, boardErr: null, busy: false, tick: null, poll: null, pollN: 0
};

/* ---------------- helpers ---------------- */

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const fmtKick = iso => new Date(iso).toLocaleString(undefined,
  { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });

// Predictions lock PREDICTION_LOCK_HOURS before kickoff, not at
// kickoff itself - see schema.sql §4 for why. This is the one place
// that boundary is computed for display; fixture_is_open() in the
// database is the one that's actually enforced.
function lockTime(kickoffIso) {
  return new Date(new Date(kickoffIso).getTime() - PREDICTION_LOCK_HOURS * 3600000);
}

function countdown(iso) {
  const ms = new Date(iso) - Date.now();
  if (ms <= 0) return "locked";
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60);
  if (h >= 1) return `${h}h ${m % 60}m`;
  return `${m}m ${Math.floor(ms / 1000) % 60}s`;
}

// Duplicates public.score()'s math in schema.sql - if you change one,
// change both. Odds-based when the fixture has locked odds on file,
// flat +5/+6 fallback otherwise (matches the SQL fallback exactly:
// same column being null covers both "not locked yet" and "the odds
// fetch failed").
function pointsForCorrectPick(pick, f) {
  const odds = pick === "H" ? f.home_odds : pick === "D" ? f.draw_odds : f.away_odds;
  if (odds != null) {
    return Math.min(Math.max(Math.round(2 * odds), 4), 10);
  }
  return pick === "D" ? REDFOOTY_RULES.scoring.draw : REDFOOTY_RULES.scoring.win;
}

function points(p, f) {
  if (!p || f.home_score == null || f.away_score == null) return 0;
  const actual = f.home_score > f.away_score ? "H" : f.home_score < f.away_score ? "A" : "D";
  if (p.pick !== actual) return 0;
  return pointsForCorrectPick(p.pick, f);
}

// DISPLAY only - never used for scoring. Layers the indicative
// preview odds on top of pointsForCorrectPick's frozen-or-flat logic,
// purely so the Predict tab has something better than a flat number
// to show for a fixture that's still more than 24h out. `final:
// false` means the value shown can still change - the UI must mark
// it (~) rather than presenting it as a real point value.
function previewPointsForPick(pick, f) {
  const frozen = pick === "H" ? f.home_odds : pick === "D" ? f.draw_odds : f.away_odds;
  if (frozen != null) return { pts: pointsForCorrectPick(pick, f), final: true };
  const preview = pick === "H" ? f.preview_home_odds : pick === "D" ? f.preview_draw_odds : f.preview_away_odds;
  if (preview != null) {
    return { pts: Math.min(Math.max(Math.round(2 * preview), 4), 10), final: false };
  }
  return { pts: pointsForCorrectPick(pick, f), final: false };
}

function pickLabel(pick, f) {
  if (pick === "H") return esc(f.home_team) + " win";
  if (pick === "A") return esc(f.away_team) + " win";
  return "Draw";
}

function toast(msg, kind = "") {
  const box = document.getElementById("toast");
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

const crest = (url, name) => url
  ? `<img src="${esc(url)}" alt="" onerror="this.style.display='none'"/>`
  : `<div style="width:30px;height:30px;border-radius:50%;background:#1C1F24;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#9AA0A6">${esc((name || "?").slice(0, 2).toUpperCase())}</div>`;

/* ---------------- data ---------------- */

async function loadFixtures() {
  const { data, error } = await sb.from("fixtures").select("*").order("kickoff_utc");
  if (error) throw error;
  S.fixtures = data || [];
}

async function loadPreds() {
  if (!S.session) return;
  const { data, error } = await sb.from("predictions")
    .select("*").eq("user_id", S.session.user.id);
  if (error) throw error;
  S.preds = {};
  (data || []).forEach(p => { S.preds[p.fixture_id] = p; });
}

async function loadProfile() {
  const { data } = await sb.from("profiles").select("*")
    .eq("id", S.session.user.id).maybeSingle();
  S.profile = data || null;
}

async function loadSyncAge() {
  const { data } = await sb.rpc("sync_age_seconds");
  S.syncAge = typeof data === "number" ? data : null;
}

async function loadBoard() {
  S.boardErr = null;
  const { data, error } = await sb.rpc("get_leaderboard");
  if (error) { S.boardErr = error.message; S.board = []; return; }
  S.board = data || [];
}

async function loadAll() {
  S.loadErr = null;
  try {
    await Promise.all([loadFixtures(), loadPreds(), loadProfile(), loadSyncAge()]);
  } catch (e) {
    S.loadErr = e.message || String(e);
  }
}

/* ---------------- auth actions ---------------- */

async function doSignup(ev) {
  ev.preventDefault();
  const f = ev.target;
  const email = f.email.value.trim().toLowerCase();
  const pw    = f.password.value;
  const name  = f.full_name.value.trim();
  const phone = f.phone.value.trim();
  const age   = parseInt(f.age.value, 10);

  if (name.length < 2)  return toast("Enter your name", "err");
  if (pw.length < 8)    return toast("Password needs at least 8 characters", "err");
  if (!/^[6-9]\d{9}$/.test(phone))
    return toast("Enter a valid 10-digit Indian mobile number", "err");
  if (!Number.isInteger(age) || age < 18 || age >= 120)
    return toast("You must be 18 or older to register", "err");

  setBusy(true);

  // Friendly pre-check so a duplicate number fails with a clear message
  // instead of a raw database error from the signup trigger.
  const { data: taken, error: checkErr } = await sb.rpc("phone_is_taken", { p: phone });
  if (checkErr) { setBusy(false); return toast(checkErr.message, "err"); }
  if (taken)    { setBusy(false); return toast("This mobile number is already registered", "err"); }

  const { data, error } = await sb.auth.signUp({
    email, password: pw,
    options: { data: {
      full_name: name,
      phone,
      age
    } }
  });
  setBusy(false);

  if (error) return toast(error.message, "err");

  if (data.session) {
    // Email confirmation is switched off in the project — that breaks
    // the OTP requirement, so say so rather than silently letting them in.
    toast("Turn on email confirmation in Supabase to enable OTP", "err");
  }
  S.otpEmail = email; S.otpFlow = "signup"; S.view = "otp";
  render();
  toast("Code sent to " + email, "ok");
}

async function doVerifyOtp(ev) {
  ev.preventDefault();
  const code = ev.target.code.value.trim();
  // This project's Supabase config sends 8-digit codes (Mailer OTP
  // Length setting), but don't hard-fail on length regardless — that
  // locks people out of their own account over a config detail they
  // can't see, and it can change on the dashboard without a code change.
  if (!code) return toast("Enter the code from your email", "err");

  setBusy(true);
  const { error } = await sb.auth.verifyOtp({
    email: S.otpEmail, token: code, type: "signup"
  });
  setBusy(false);
  if (error) return toast(error.message, "err");
  toast("You're in", "ok");   // onAuthStateChange takes it from here
}

async function resendOtp() {
  setBusy(true);
  const { error } = await sb.auth.resend({ type: "signup", email: S.otpEmail });
  setBusy(false);
  toast(error ? error.message : "New code sent", error ? "err" : "ok");
}

async function doLogin(ev) {
  ev.preventDefault();
  const f = ev.target;
  setBusy(true);
  const { error } = await sb.auth.signInWithPassword({
    email: f.email.value.trim().toLowerCase(), password: f.password.value
  });
  setBusy(false);
  if (error) return toast(error.message, "err");
}

async function startReset(email) {
  const addr = (email || "").trim().toLowerCase();
  if (!addr) return toast("Enter your email first", "err");
  setBusy(true);
  const { error } = await sb.auth.resetPasswordForEmail(addr);
  setBusy(false);
  if (error) return toast(error.message, "err");
  S.otpEmail = addr; S.otpFlow = "recovery"; S.view = "reset";
  render();
  toast("Code sent to " + addr, "ok");
}

async function doReset(ev) {
  ev.preventDefault();
  const f = ev.target;
  const code = f.code.value.trim(), pw = f.password.value;
  if (!code)         return toast("Enter the code from your email", "err");
  if (pw.length < 8) return toast("Password needs at least 8 characters", "err");

  setBusy(true);
  const v = await sb.auth.verifyOtp({ email: S.otpEmail, token: code, type: "recovery" });
  if (v.error) { setBusy(false); return toast(v.error.message, "err"); }

  const u = await sb.auth.updateUser({ password: pw });
  if (u.error) { setBusy(false); return toast(u.error.message, "err"); }

  // verifyOtp(type: "recovery") signs the user in - render() always shows
  // the app shell while a session exists, so S.view alone can't get back
  // to the login screen. Sign out for real so the new password has to be
  // used, not just glanced past.
  S.view = "login"; S.tab = "settings";
  await sb.auth.signOut();
  setBusy(false);
  render();
  toast("Password changed - please sign in again", "ok");
}

async function doLogout() {
  await sb.auth.signOut();
}

/* ---------------- prediction action ---------------- */

async function savePrediction(fid, pick) {
  if (!["H", "D", "A"].includes(pick)) return toast("Pick a result first", "err");

  setBusy(true);
  const { error } = await sb.from("predictions").upsert({
    user_id: S.session.user.id, fixture_id: fid, pick
  }, { onConflict: "user_id,fixture_id" });
  setBusy(false);

  if (error) {
    // 42501 = RLS rejection, which here means kickoff has passed.
    const msg = error.code === "42501"
      ? "That match has kicked off — predictions are closed"
      : error.message;
    toast(msg, "err");
    await loadFixtures();
    renderKeepInputs();
    return;
  }

  toast("Prediction saved", "ok");
  await loadPreds();
  renderKeepInputs();
}

/* ---------------- screens: auth ---------------- */

function loginScreen() {
  return `<div class="auth-wrap">
    <div class="brand-row" style="justify-content:center;margin-bottom:26px">
      <img class="brand-mark" src="${LOGO_URL}" alt="Redfooty"/>
      <div class="logo"><em>Redfooty</em> EPL Predictor</div>
    </div>
    <div class="auth-title">Welcome back</div>
    <div class="auth-sub">Call the Win, Draw, or Loss on every Premier League match and see where you land.</div>
    <form onsubmit="doLogin(event)">
      <div class="field"><label for="li-email">Email</label>
        <input id="li-email" name="email" type="email" autocomplete="email" required/></div>
      <div class="field"><label for="li-pw">Password</label>
        <input id="li-pw" name="password" type="password" autocomplete="current-password" required/></div>
      <button class="btn" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "Signing in…" : "Sign in"}</button>
    </form>
    <div class="auth-alt">
      <button class="link" onclick="startReset(document.getElementById('li-email').value)">Forgot password?</button>
    </div>
    <div class="auth-alt">No account? <button class="link" onclick="go('signup')">Create one</button></div>
  </div>`;
}

function signupScreen() {
  return `<div class="auth-wrap">
    <div class="brand-row" style="justify-content:center;margin-bottom:26px">
      <img class="brand-mark" src="${LOGO_URL}" alt="Redfooty"/>
      <div class="logo"><em>Redfooty</em> EPL Predictor</div>
    </div>
    <div class="auth-title">Create account</div>
    <div class="auth-sub">We'll email you an 8-digit code to confirm it's you.</div>
    <form onsubmit="doSignup(event)">
      <div class="field"><label for="su-name">Full name</label>
        <input id="su-name" name="full_name" type="text" autocomplete="name" required/></div>
      <div class="field"><label for="su-email">Email</label>
        <input id="su-email" name="email" type="email" autocomplete="email" required/></div>
      <div class="field"><label for="su-phone">Mobile number</label>
        <input id="su-phone" name="phone" type="tel" autocomplete="tel" inputmode="numeric"
               pattern="[6-9][0-9]{9}" maxlength="10" placeholder="10-digit mobile number" required/>
        <div class="hint">10-digit Indian mobile number. Codes still go to your email, not this number.</div></div>
      <div class="field"><label for="su-age">Age</label>
        <input id="su-age" name="age" type="number" inputmode="numeric" min="18" max="119" required/>
        <div class="hint">You must be 18 or older to register.</div></div>
      <div class="field"><label for="su-pw">Password</label>
        <input id="su-pw" name="password" type="password" autocomplete="new-password" required/>
        <div class="hint">At least 8 characters.</div></div>
      <button class="btn" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "Sending code…" : "Send code"}</button>
    </form>
    <div class="auth-alt">Already registered? <button class="link" onclick="go('login')">Sign in</button></div>
  </div>`;
}

function otpScreen() {
  return `<div class="auth-wrap">
    <div class="auth-title">Check your email</div>
    <div class="auth-sub">We sent an 8-digit code to <strong>${esc(S.otpEmail)}</strong>. It expires in an hour.</div>
    <form onsubmit="doVerifyOtp(event)">
      <div class="field"><label for="otp">Code</label>
        <input id="otp" class="otp-input" name="code" type="text" inputmode="numeric"
               maxlength="10" autocomplete="one-time-code" placeholder="00000000" required/></div>
      <button class="btn" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "Verifying…" : "Verify"}</button>

    <div class="auth-alt"><button class="link" onclick="resendOtp()">Send another code</button></div>

function resetScreen() {
  return `<div class="auth-wrap">
    <div class="auth-title">Set a new password</div>
    <div class="auth-sub">Enter the code we sent to <strong>${esc(S.otpEmail)}</strong>, then choose a new password.</div>
    <form onsubmit="doReset(event)">
      <div class="field"><label for="rs-code">Code</label>
        <input id="rs-code" class="otp-input" name="code" type="text" inputmode="numeric"
               maxlength="10" autocomplete="one-time-code" placeholder="00000000" required/></div>
      <div class="field"><label for="rs-pw">New password</label>
        <input id="rs-pw" name="password" type="password" autocomplete="new-password" required/>
        <div class="hint">At least 8 characters.</div></div>
      <button class="btn" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? "Saving…" : "Change password"}</button>

    <div class="auth-alt"><button class="link" onclick="go('login')">Cancel</button></div>

/* ---------------- screens: app ---------------- */

function shell() {
  const name = S.profile?.full_name || S.session.user.email;
  const tabs = [["predict", "Predict"], ["results", "Results"], ["table", "Leaderboard"], ["rules", "Rules"], ["settings", "You"]];
  return `
    <div class="header">
      <div class="header-top">
        <div class="brand-row">
          <img class="brand-mark" src="${LOGO_URL}" alt="Redfooty"/>
          <div>
            <div class="logo"><em>Redfooty</em> EPL Predictor</div>
            <div class="logo-sub">India</div>
          </div>
        </div>
      </div>
      <div class="user-pill" style="margin-top:8px">${esc(name)}</div>
      <div class="nav">
        ${tabs.map(([k, label]) =>
          `<button class="nav-btn ${S.tab === k ? "active" : ""}" onclick="setTab('${k}')">${label}</button>`
        ).join("")}
      </div>
    </div>
    <div class="section">
      ${S.loadErr ? `<div class="banner banner-err">Couldn't load data: ${esc(S.loadErr)} <button class="link" onclick="refresh()">Retry</button></div>` : ""}
      ${staleBanner()}
      ${S.tab === "predict"  ? predictTab()  : ""}
      ${S.tab === "results"  ? resultsTab()  : ""}
      ${S.tab === "table"    ? tableTab()    : ""}
      ${S.tab === "rules"    ? rulesTab()    : ""}
      ${S.tab === "settings" ? settingsTab() : ""}
    </div>`;
}

function staleBanner() {
  if (S.syncAge == null || S.syncAge < 20 * 60) return "";
  const mins = Math.floor(S.syncAge / 60);
  const label = mins > 1440 ? "never run" : `${mins} minutes old`;
  return `<div class="banner banner-warn">Match data is ${label}. Kickoff times and scores may be wrong — the sync job needs a look.</div>`;
}

function liveStrip() {
  const live = S.fixtures.filter(f => LIVE_STATUS.includes(f.status));
  if (!live.length) return "";
  return `<div class="eyebrow">Live now</div>` + live.map(f => {
    const p = S.preds[f.id];
    return `<div class="card-live">
      <div class="match-meta">
        <span class="badge b-live"><span class="live-dot"></span>Live</span>
        <span class="match-time">${f.status === "PAUSED" ? "Half time" : "In play"}</span>
      </div>
      <div class="teams-row">
        <div class="team">${crest(f.home_crest, f.home_team)}<div class="team-name">${esc(f.home_team)}</div></div>
        <div class="score">${f.home_score ?? 0} – ${f.away_score ?? 0}</div>
        <div class="team">${crest(f.away_crest, f.away_team)}<div class="team-name">${esc(f.away_team)}</div></div>
      </div>
      ${p ? `<div class="match-time" style="text-align:center;margin-top:10px">You picked ${pickLabel(p.pick, f)}</div>` : ""}
    </div>`;
  }).join("");
}

function predictTab() {
  const open = S.fixtures.filter(f =>
    OPEN_STATUS.includes(f.status) && lockTime(f.kickoff_utc) > new Date());

  const strip = liveStrip();

  if (!S.fixtures.length) {
    return strip + `<div class="empty">No fixtures yet.<br/>The sync job hasn't put anything in the table — check <code>cron.job_run_details</code>.</div>`;
  }
  if (!open.length) {
    return strip + `<div class="empty">Nothing left to predict.<br/>Every remaining fixture has locked.</div>`;
  }

  const mds = [...new Set(open.map(f => f.matchday))].sort((a, b) => a - b);
  if (S.md == null || !mds.includes(S.md)) S.md = mds[0];
  const list = open.filter(f => f.matchday === S.md);

  const hasPreview = list.some(f => f.home_odds == null);
  const previewBanner = hasPreview
    ? `<div class="banner banner-warn">Points marked <strong>~</strong> are estimates and will change. They freeze into final values 24 hours before kickoff.</div>`
    : "";

  return strip + `
    <div class="eyebrow">Open fixtures</div>
    <select class="sel" onchange="setMd(this.value)">
      ${mds.map(m => `<option value="${m}" ${m === S.md ? "selected" : ""}>Gameweek ${m}</option>`).join("")}
    </select>
    ${previewBanner}
    ${list.map(predictCard).join("")}`;
}

function pickBtn(f, side, label, active) {
  const accent = side === "D" ? "amber" : "blue";
  const { pts, final } = previewPointsForPick(side, f);
  const ptsLabel = final ? `+${pts}` : `~${pts}`;
  return `<button class="pick-btn ${active ? "pick-active-" + accent : ""}"
            onclick="savePrediction(${f.id},'${side}')" ${S.busy ? "disabled" : ""}>
            <div class="pick-label">${label} <span class="pick-pts${final ? "" : " pick-pts-preview"}">${ptsLabel}</span></div>
          </button>`;
}

function predictCard(f) {
  const p = S.preds[f.id];
  const lock = lockTime(f.kickoff_utc);
  const soon = lock - Date.now() < 3600000;
  return `<div class="card">
    <div class="match-meta">
      <span class="match-time">${esc(fmtKick(f.kickoff_utc))}</span>
      <span class="badge ${soon ? "b-soon" : "b-off"}">
        locks in <span data-ko="${esc(lock.toISOString())}">${countdown(lock)}</span>
      </span>
    </div>
    <div class="teams-row">
      <div class="team">${crest(f.home_crest, f.home_team)}<div class="team-name">${esc(f.home_team)}</div></div>
      <div class="vs">vs</div>
      <div class="team">${crest(f.away_crest, f.away_team)}<div class="team-name">${esc(f.away_team)}</div></div>
    </div>
    <div class="pred-row">
      ${pickBtn(f, "H", "Win", p?.pick === "H")}
      ${pickBtn(f, "D", "Draw", p?.pick === "D")}
      ${pickBtn(f, "A", "Win", p?.pick === "A")}
    </div>
  </div>`;
}

function resultsTab() {
  const fin = S.fixtures.filter(f => f.status === "FINISHED");
  if (!fin.length) return `<div class="empty">No finished matches yet.<br/>Come back after the first whistle.</div>`;

  const mds = [...new Set(fin.map(f => f.matchday))].sort((a, b) => b - a);
  if (S.rmd == null || !mds.includes(S.rmd)) S.rmd = mds[0];
  const list = fin.filter(f => f.matchday === S.rmd)
                  .sort((a, b) => new Date(b.kickoff_utc) - new Date(a.kickoff_utc));

  const mine = list.filter(f => S.preds[f.id]);
  const total = mine.reduce((n, f) => n + points(S.preds[f.id], f), 0);

  return `
    <div class="eyebrow">Results</div>
    <select class="sel" onchange="setRmd(this.value)">
      ${mds.map(m => `<option value="${m}" ${m === S.rmd ? "selected" : ""}>Gameweek ${m}</option>`).join("")}
    </select>
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-size:13px;font-weight:600">Gameweek ${S.rmd}</div>
        <div class="match-time">${mine.length} of ${list.length} predicted</div></div>
      <div style="text-align:right"><div class="lb-pts">${total}</div>
        <div class="match-time">points</div></div>
    </div>
    ${list.map(resultCard).join("")}`;
}

function ptBadgeClass(pt) {
  if (pt <= 0) return "b-p0";
  if (pt <= 4) return "b-p2";
  if (pt <= 7) return "b-p5";
  return "b-p10";
}

function resultCard(f) {
  const p = S.preds[f.id];
  const pt = points(p, f);
  return `<div class="card">
    <div class="match-meta">
      <span class="match-time">${esc(fmtKick(f.kickoff_utc))}</span>
      ${p ? `<span class="badge ${ptBadgeClass(pt)}">+${pt} pts</span>` : `<span class="badge b-off">no prediction</span>`}
    </div>
    <div class="teams-row">
      <div class="team">${crest(f.home_crest, f.home_team)}<div class="team-name">${esc(f.home_team)}</div></div>
      <div class="score">${f.home_score} – ${f.away_score}</div>
      <div class="team">${crest(f.away_crest, f.away_team)}<div class="team-name">${esc(f.away_team)}</div></div>
    </div>
    ${p ? `<div class="match-time" style="text-align:center;margin-top:10px">You picked ${pickLabel(p.pick, f)}</div>` : ""}
  </div>`;
}

function tableTab() {
  if (S.boardErr) return `<div class="banner banner-err">Couldn't load the table: ${esc(S.boardErr)} <button class="link" onclick="refreshBoard()">Retry</button></div>`;
  if (!S.board.length) return `<div class="empty">Nobody's on the board yet.<br/>Points appear once matches finish.</div>`;

  const me = S.session.user.id;
  return `<div class="eyebrow">Standings</div>
    <div class="banner banner-info">Predict at least 75% of matches completed so far to stay eligible for prizes — a rolling requirement, recalculated as the season goes on.</div>
    ` + S.board.map(r => `
    <div class="lb-row ${r.user_id === me ? "me" : ""}">
      <div class="lb-rank">${r.rank}</div>
      <div class="lb-name">${esc(r.full_name || "Unnamed")}
        <div class="lb-sub">${r.correct_picks} correct · ${r.matches_predicted}/${r.matches_completed} matches (${r.participation_pct}%)</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0">
        <div class="lb-pts">${r.points}</div>
        <span class="badge ${r.eligible ? "b-elig" : "b-inelig"}">${r.eligible ? "Eligible" : "Not eligible"}</span>
      </div>
    </div>`).join("");
}

function rulesTab() {
  const r = REDFOOTY_RULES;
  return `
    <div class="eyebrow">Official Rules</div>
    ${r.rulesSections.map(s => `
      <details class="card" name="rules-accordion" style="padding:0">
        <summary style="padding:16px;cursor:pointer;font-weight:700;font-size:14px;list-style:none">${esc(s.title)}</summary>
        <ul style="padding:0 16px 16px 32px;margin:0">
          ${s.points.map(pt => `<li style="font-size:12.5px;color:#94a3b8;line-height:1.6;margin-bottom:6px">${esc(pt)}</li>`).join("")}
        </ul>
      </details>
    `).join("")}

    <div class="eyebrow" style="margin-top:6px">Prizes</div>
    <details class="card" name="rules-accordion" style="padding:0">
      <summary style="padding:16px;cursor:pointer;font-weight:700;font-size:14px;list-style:none">Prize pool — tap to expand</summary>
      <div style="padding:0 16px 16px">
        ${r.prizes.map(p => `
          <div style="padding:12px 0;border-top:1px solid var(--line)">
            <div style="font-weight:700;color:#f1f5f9">${esc(p.place)} place</div>
            <div style="font-size:14px;font-weight:700;margin:2px 0 4px">${esc(p.title)}</div>
            <div style="font-size:12px;color:#94a3b8;line-height:1.5">${esc(p.detail)}</div>
          </div>
        `).join("")}
        <div style="font-size:11px;color:#9AA0A6;margin-top:8px">Prizes are subject to change before the season ends — the rules above always govern.</div>
      </div>
    </details>

    <div class="card" style="text-align:center;background:transparent;border:none">
      <a class="pill-support" href="mailto:${esc(r.contactEmail)}?subject=Redfooty%20Predictor%20-%20Report%20an%20issue">Report an issue</a>
    </div>`;
}

function settingsTab() {
  const u = S.session.user;
  const p = S.profile;
  return `
    <div class="eyebrow">Your details</div>
    <div class="card">
      <div class="kv"><span>Name</span><span>${esc(p?.full_name || "—")}</span></div>
      <div class="kv"><span>Email</span><span>${esc(u.email)}</span></div>
      <div class="kv"><span>Phone</span><span>${esc(p?.phone || "—")}</span></div>
      <div class="kv"><span>Joined</span><span>${p ? new Date(p.created_at).toLocaleDateString() : "—"}</span></div>
    </div>
    <div class="eyebrow">Account</div>
    <div class="card">
      <div style="font-size:13px;color:#94a3b8;line-height:1.5;margin-bottom:12px">
        Changing your password sends an 8-digit code to ${esc(u.email)} first.
      </div>
      <button class="btn btn-ghost" style="margin-top:0" onclick="startReset('${esc(u.email)}')">Change password</button>
      <button class="btn btn-danger" onclick="doLogout()">Sign out</button>
    </div>
    <div class="card" style="background:transparent;border:none;text-align:center;padding-top:0">
      <span class="match-time">Data synced ${S.syncAge == null ? "—" : Math.floor(S.syncAge / 60) + "m ago"}</span>
      <div style="margin-top:8px"><a class="pill-brand" href="https://redfooty.com/" target="_blank" rel="noopener">About Redfooty</a></div>
    </div>`;
}

/* ---------------- render + routing ---------------- */

function render() {
  if (!S.ready) {
    app.innerHTML = `<div class="empty" style="padding-top:80px"><span class="spin">◠</span><br/><br/>Starting up</div>`;
    return;
  }
  if (S.view === "otp")   { app.innerHTML = otpScreen();   return stopTimers(); }
  if (S.view === "reset") { app.innerHTML = resetScreen(); return stopTimers(); }
  if (!S.session) {
    app.innerHTML = S.view === "signup" ? signupScreen() : loginScreen();
    return stopTimers();
  }
  app.innerHTML = shell();
  startTimers();
}

// Re-render without losing whatever the person is halfway through typing.
function renderKeepInputs() {
  const snap = {};
  document.querySelectorAll("input[data-keep]").forEach(i => { snap[i.id] = i.value; });
  render();
  Object.entries(snap).forEach(([id, v]) => {
    const el = document.getElementById(id);
    if (el) el.value = v;
  });
}

function go(view)   { S.view = view; render(); }
function setTab(t)  {
  S.tab = t; render();
  if (t === "table") refreshBoard();
}
function setMd(v)   { S.md  = Number(v); render(); }
function setRmd(v)  { S.rmd = Number(v); render(); }
function setBusy(b) { S.busy = b; renderKeepInputs(); }

async function refresh() {
  await loadAll();
  renderKeepInputs();
}

async function refreshBoard() {
  await loadBoard();
  if (S.tab === "table") render();
}

/* ---------------- timers ---------------- */

function startTimers() {
  if (!S.tick) S.tick = setInterval(() => {
    document.querySelectorAll("[data-ko]").forEach(el => {
      el.textContent = countdown(el.dataset.ko);
    });
  }, 1000);

  if (!S.poll) S.poll = setInterval(async () => {
    S.pollN++;
    const live = S.fixtures.some(f => LIVE_STATUS.includes(f.status));
    // Every minute while matches are on, every five otherwise.
    if (!live && S.pollN % 5 !== 0) return;
    await loadFixtures();
    await loadSyncAge();
    renderKeepInputs();
  }, 60000);
}

function stopTimers() {
  clearInterval(S.tick); clearInterval(S.poll);
  S.tick = null; S.poll = null;
}

/* ---------------- boot ---------------- */

sb.auth.onAuthStateChange(async (event, session) => {
  S.session = session;
  S.ready = true;

  if (session) {
    if (S.view === "otp" || S.view === "signup") S.view = "login";
    if (S.view !== "reset") {
      await loadAll();
      render();
      if (S.tab === "table") refreshBoard();
    }
  } else {
    S.profile = null; S.fixtures = []; S.preds = {}; S.board = [];
    if (S.view !== "signup" && S.view !== "otp" && S.view !== "reset") S.view = "login";
    render();
  }
});

if (SUPABASE_URL.startsWith("PASTE")) {
  S.ready = true;
  app.innerHTML = `<div class="auth-wrap"><div class="banner banner-err">
    Add your Supabase URL and anon key to the CONFIG block at the top of this file.
  </div></div>`;
}
</script>
