[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/Landing_Page.html"
  status = 200

[[redirects]]
  from = "/predict"
  to = "/epl-predictor.html"
  status = 200

# `publish = "."` serves the whole repo root, which otherwise makes the
# schema, sync function source, ops docs, and the T&C PDF (marked
# "prepared for internal use" — it has a public rules section but also
# an internal site audit and roadmap) fetchable by anyone who guesses
# the filename. Block them explicitly. rules-data.js is deliberately
# NOT in this list — both public pages load it directly.
[[redirects]]
  from = "/schema.sql"
  to = "/Landing_Page.html"
  status = 404

[[redirects]]
  from = "/cron.sql"
  to = "/Landing_Page.html"
  status = 404

[[redirects]]
  from = "/index.ts"
  to = "/Landing_Page.html"
  status = 404

[[redirects]]
  from = "/README.md"
  to = "/Landing_Page.html"
  status = 404

[[redirects]]
  from = "/Terms_conditions_Plan.pdf"
  to = "/Landing_Page.html"
  status = 404
